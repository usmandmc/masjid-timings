<style id="app-style">
/* Layout: a single column. A list of mosques with the next prayer on each row, then one page per mosque with the five times as a ruled board. */
:root {

  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1426; --surface: #151e36; --fg: #e7ebf5; --muted: #9aa6c2;
    --line: #27324f; --accent: #43c6af; --accent-fg: #0d1426; --tint: #173a3f;
    --change: #ffb347; --change-tint: #3a2c14; --danger: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1426; --surface: #151e36; --fg: #e7ebf5; --muted: #9aa6c2;
  --line: #27324f; --accent: #43c6af; --accent-fg: #0d1426; --tint: #173a3f;

  color-scheme: dark;
}

* { box-sizing: border-box; }

  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
  padding-block: 0 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin-inline: auto; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; }
.label { font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }

header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-block: 20px; border-bottom: 1px solid var(--line); }
.brand { font-family: var(--display); font-weight: 700; font-size: 22px; text-decoration: none; }
.brand small { display: block; font-family: var(--mono); font-weight: 400; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

button, .btn {
  font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block;
  border-radius: 4px; padding: 9px 16px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
button:hover, .btn:hover { border-color: var(--accent); }
.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.primary:hover { filter: brightness(1.08); }
.danger { color: var(--danger); }
button[disabled] { opacity: 0.6; cursor: default; }

main { padding-block: 24px; display: grid; gap: 20px; }
#status { min-height: 1.4em; font-size: 14px; color: var(--accent); font-weight: 600; }

.filters { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.filters > * { min-width: 0; }
input, select, textarea {
  font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 4px; padding: 10px 12px; width: 100%;
}
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
.row > * { min-width: 0; }
.row a.main-link { text-decoration: none; display: grid; gap: 2px; }
.row h2 { font-size: 19px; }
.row .next { font-family: var(--mono); font-size: 14px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.tag.change { background: var(--change-tint); color: var(--change); font-weight: 500; }

.panel { background: var(--change-tint); border: 1px solid var(--change); border-radius: 6px; padding: 14px 16px; display: grid; gap: 10px; }
.panel h2 { font-size: 17px; color: var(--change); }
.panel ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.panel .actions { display: flex; gap: 10px; flex-wrap: wrap; }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 6px; padding: 28px 20px; text-align: center; display: grid; gap: 12px; justify-items: center; }

.back { font-size: 15px; }
.hero { display: grid; gap: 6px; }
.hero h1 { font-size: clamp(1.9rem, 6vw, 2.6rem); }
.nextbox { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px 20px; display: grid; gap: 4px; }
.nextbox .big { font-family: var(--display); font-weight: 700; font-size: clamp(1.8rem, 7vw, 2.6rem); line-height: 1.1; }
.nextbox .big span { font-family: var(--mono); font-weight: 500; font-size: 0.7em; margin-left: 6px; }
.board { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.board table { width: 100%; border-collapse: collapse; }
.board th, .board td { padding: 13px 20px; text-align: left; border-bottom: 1px solid var(--line); font-weight: 400; }
.board tr:last-child th, .board tr:last-child td { border-bottom: 0; }
.board th { font-family: var(--display); font-weight: 500; font-size: 18px; }
.board td { text-align: right; font-family: var(--mono); font-size: 18px; font-variant-numeric: tabular-nums; }
.board tr.is-next { background: var(--tint); }
.board tr.is-next th, .board tr.is-next td { font-weight: 700; }
.board tr.jummah th, .board tr.jummah td { color: var(--muted); font-size: 15px; }
.actions-row { display: flex; flex-wrap: wrap; gap: 10px; }
.history { display: grid; gap: 8px; }
.history ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.history li { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; border-top: 1px solid var(--line); padding-top: 8px; }
.history li time { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 2px; }

form { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 20px; display: grid; gap: 16px; }
form h1 { font-size: 24px; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 600; font-size: 14px; }
.field .fixed { font-family: var(--mono); padding: 10px 12px; border: 1px dashed var(--line); border-radius: 4px; color: var(--muted); }
.times { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.times > * { min-width: 0; }
.err { color: var(--danger); font-weight: 600; min-height: 1.3em; margin: 0; font-size: 14px; }

footer { border-top: 1px solid var(--line); padding-top: 18px; color: var(--muted); font-size: 14px; display: grid; gap: 4px; }
footer p { margin: 0; max-width: 60ch; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap" id="shell">

    <p>Each mosque's committee keeps its own times. If a time matters, confirm it with the mosque.</p>
    <p>Follow a mosque and any change to its times appears at the top of the page the next time you open it on this device.</p>
  </footer>
</div>

<script id="app-script">

  var HEAD = '<title>Masjid Timings</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Public+Sans:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">';
  var RESET = ':root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';

  var view = document.getElementById("view");

        ul.append(el("li", null, el("time", { text: fmtDate(e.at) }), el("span", { text: changeText(e) })));
      });
      view.append(el("section", { class: "history" }, el("h2", { class: "label", text: "Recent changes" }), ul));
    }
  }

  function renderForm(id) {
    var isNew = !id;
    if (!canWrite) {
      view.append(el("a", { class: "back", href: "#", text: "← All mosques" }),
        el("div", { class: "empty" }, el("h2", { text: "Only the page editors can change times" }),
          el("p", { class: "muted", text: "If you manage a mosque, ask the page owner to give you Editor access." })));
      return;
    }
    var cur = isNew ? { times: {}, log: [] } : getMosque(id);
    if (!cur) {
      view.append(el("a", { class: "back", href: "#", text: "← All mosques" }),
        el("div", { class: "empty" }, el("h2", { text: "Mosque not found" })));
      return;
    }
    var err = el("p", { class: "err", role: "alert" });
    var saveBtn = el("button", { class: "primary", type: "submit", text: isNew ? "Add mosque" : "Save times" });

    var timeFields = [];
    ALL.forEach(function (p) {
      if (FIXED[p[0]]) {
        timeFields.push(el("div", { class: "field" },
          el("label", { text: p[1] }), el("div", { class: "fixed", text: FIXED[p[0]] })));
        return;
      }
      timeFields.push(el("div", { class: "field" },
        el("label", { for: "t-" + p[0], text: p[1] + (p[0] === "jummah" ? " (optional)" : "") }),
        el("input", { id: "t-" + p[0], type: "time", value: (cur.times && cur.times[p[0]]) || "" })));
    });

    var form = el("form", { novalidate: true },
      el("h1", { text: isNew ? "Add a mosque" : "Update times" }),
      el("div", { class: "field" }, el("label", { for: "f-name", text: "Mosque name" }),
        el("input", { id: "f-name", type: "text", value: cur.name || "", autocomplete: "off" })),
      el("div", { class: "field" }, el("label", { for: "f-area", text: "Area or neighbourhood" }),
        el("input", { id: "f-area", type: "text", value: cur.area || "", autocomplete: "off" })),
      el("div", { class: "field" }, el("label", { for: "f-address", text: "Street address (optional)" }),
        el("input", { id: "f-address", type: "text", value: cur.address || "", autocomplete: "off" })),
      el("div", { class: "times" }, timeFields),
      err,
      el("div", { class: "actions-row" }, saveBtn,
        el("a", { class: "btn", href: isNew ? "#" : "#m-" + id, text: "Cancel" })));

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      err.textContent = "";
      var name = document.getElementById("f-name").value.trim();
      if (!name) { err.textContent = "Enter the mosque name."; return; }
      var times = {};
      for (var i = 0; i < ALL.length; i++) {
        var k = ALL[i][0];
        if (FIXED[k]) continue;
        var v = document.getElementById("t-" + k).value;
        if (!v && k !== "jummah") { err.textContent = "Enter the " + ALL[i][1] + " time."; return; }
        if (v) times[k] = v;
      }
      var area = document.getElementById("f-area").value.trim();
      var address = document.getElementById("f-address").value.trim();
      var at = new Date().toISOString();
      var next = JSON.parse(JSON.stringify(state));

      if (isNew) {
        var newId = "m" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
        next.mosques.push({ id: newId, name: name, area: area, address: address, times: times, updatedAt: at, log: [] });
        saveBtn.disabled = true;
        commit(next, "#m-" + newId);
        return;
      }
      var diffs = [];
      ALL.forEach(function (p) {
        if (FIXED[p[0]]) return;
        var before = (cur.times && cur.times[p[0]]) || "";
        var after = times[p[0]] || "";
        if (before !== after) diffs.push({ at: at, prayer: p[0], from: before, to: after });
      });
      var target = next.mosques.filter(function (x) { return x.id === id; })[0];
      target.name = name; target.area = area; target.address = address; target.times = times;
      if (diffs.length) {
        target.updatedAt = at;
        target.log = diffs.concat(shownLog(cur)).slice(0, 12);
      }
      saveBtn.disabled = true;
      commit(next, "#m-" + id);
    });

    view.append(el("a", { class: "back", href: isNew ? "#" : "#m-" + id, text: "← Back" }), form);

    if (!isNew) {
      var armed = false;
      var del = el("button", { class: "danger", type: "button", text: "Delete this mosque" });
      del.addEventListener("click", function () {
        if (!armed) {
          armed = true; del.textContent = "Select again to delete for good";
          setTimeout(function () { armed = false; del.textContent = "Delete this mosque"; }, 4000);
          return;
        }
        var next = JSON.parse(JSON.stringify(state));
        next.mosques = next.mosques.filter(function (x) { return x.id !== id; });
        commit(next, "#");
      });
      view.append(el("div", { class: "actions-row" }, del));
    }
  }

  /* Build the full page, with the current data inside it, and save it as the new version. */
  function buildDoc(data) {
    var json = JSON.stringify(data).replace(/</g, "\\u003c");
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>' +
      HEAD + '<style id="app-style">' + CSS + '</style>' + SHELL +
      '<script type="application/json" id="state">' + json + '<\/script>' +
      '<script id="app-script">' + JS + '<\/script></body></html>';
  }

  function commit(next, hashAfter) {
    var prevHash = location.hash;
    flash("Saving…");
    if (hashAfter) location.hash = hashAfter;
    return artifactNs.publish(buildDoc(next)).then(function () {
      state = next;
      flash("Saved.");
    }, function (e) {
      location.hash = prevHash;
      var code = e && e.code;
      if (code === "conflict") flash("Someone saved at the same moment. The page is reloading with their version; make your change again.");
      else if (code === "not_granted" || code === "not_writer") { canWrite = false; flash("Your account can view this page but not change it."); render(); }
      else flash("Could not save. Check your connection and try again.");
      var b = document.querySelector("form button[type=submit]");
      if (b) b.disabled = false;
    });
  }

  function tick() {
    document.querySelectorAll(".js-next").forEach(function (node) {
      var m = getMosque(node.getAttribute("data-id"));
      if (m) node.textContent = nextLine(m);
    });
    if (route().v === "detail" && document.querySelector(".js-next-in")) render();
  }
  setInterval(tick, 30000);

  window.addEventListener("hashchange", function () { window.scrollTo(0, 0); render(); });

  render();

  /* Anyone can read the page. Editing lights up only for people allowed to save it. */
  if (window.claude && window.claude.use) {
    Promise.all([window.claude.use("artifact"), window.claude.use("user")]).then(function (res) {
      artifactNs = res[0];
      return res[1] ? res[1].canEdit() : false;
    }).then(function (ce) {
      canWrite = !!(artifactNs && ce);
      if (!document.querySelector("form")) render();
    }).catch(function () {});
  }
})();
</script>

</body></html>
